<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KAP Recorder: Palliative Care Study, HIMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#F6F4EF; --surface:#FFFFFF; --ink:#1F2A30; --muted:#55626A; --line:#DCD6CB;
  --teal:#1E5560; --teal-soft:#E3EEEE; --amber:#8A5300; --amber-soft:#FBEFD9; --red:#9B2C22; --red-soft:#F8E3E0;
  --green:#2E6B3A; --green-soft:#E2F0E3; --on-teal:#FFFFFF;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#141A1C; --surface:#1C2427; --ink:#E8ECEC; --muted:#A3AFB4; --line:#33403F;
    --teal:#7FC1C8; --teal-soft:#1F3437; --amber:#F0B860; --amber-soft:#3A2C14; --red:#F2998F; --red-soft:#3B1E1A;
    --green:#8FD19A; --green-soft:#1D3321; --on-teal:#0E1A1C;
  }
}
:root[data-theme="dark"]{
  --ground:#141A1C; --surface:#1C2427; --ink:#E8ECEC; --muted:#A3AFB4; --line:#33403F;
  --teal:#7FC1C8; --teal-soft:#1F3437; --amber:#F0B860; --amber-soft:#3A2C14; --red:#F2998F; --red-soft:#3B1E1A;
  --green:#8FD19A; --green-soft:#1D3321; --on-teal:#0E1A1C;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:20px}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:'Mukta','Noto Sans Devanagari','Nirmala UI',system-ui,sans-serif;font-size:1rem;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:20px 18px 48px}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;padding-bottom:14px;border-bottom:2px solid var(--teal);margin-bottom:18px}
header.top h1{margin:0;font-size:1.55rem;line-height:1.15;font-weight:700;color:var(--teal)}
header.top p{margin:2px 0 0;color:var(--muted);font-size:.95rem}
.btn{border:1px solid var(--teal);background:var(--teal);color:var(--on-teal);border-radius:8px;padding:9px 16px;min-height:44px;font-weight:600}
.btn.ghost{background:transparent;color:var(--teal)}
.btn.danger{background:transparent;border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.note{background:var(--amber-soft);color:var(--ink);border-radius:8px;padding:10px 14px;font-size:.95rem;margin:0 0 16px}
.note strong{color:var(--amber)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:0 0 18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat b{display:block;font-size:1.6rem;line-height:1.1}
.stat span{color:var(--muted);font-size:.9rem}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:860px;font-size:.95rem}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-weight:600;color:var(--muted);font-size:.85rem}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.85rem;font-weight:600;white-space:nowrap}
.p-wait{background:var(--teal-soft);color:var(--teal)}
.p-due{background:var(--green-soft);color:var(--green)}
.p-late{background:var(--red-soft);color:var(--red)}
.p-done{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.p-amber{background:var(--amber-soft);color:var(--amber)}
.linkbtn{background:none;border:none;color:var(--teal);font-weight:600;padding:6px 4px;min-height:36px;text-decoration:underline;text-underline-offset:3px}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
/* questionnaire */
.qhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.qhead .who{font-weight:700;font-size:1.1rem}
.lang{display:inline-flex;border:1px solid var(--teal);border-radius:8px;overflow:hidden}
.lang button{border:none;background:transparent;padding:6px 14px;min-height:40px;color:var(--teal);font-weight:600}
.lang button[aria-pressed="true"]{background:var(--teal);color:var(--on-teal)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 18px}
.progress i{display:block;height:100%;background:var(--teal)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px 20px}
.domain{color:var(--muted);font-size:.95rem;margin:0 0 6px}
.qtext{font-size:2rem;line-height:1.35;font-weight:600;margin:0 0 22px;text-wrap:pretty}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:14px 16px;min-height:64px;font-size:1.4rem;font-weight:600;text-align:left;display:flex;gap:12px;align-items:center}
.opt .k{flex-shrink:0;width:36px;height:36px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.95rem}
.opt[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.opt[aria-pressed="true"] .k{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.qnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.95rem}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;min-height:44px;font-weight:400}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:8px 16px;min-height:44px;font-weight:600}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--teal);color:var(--on-teal)}
.yn{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.review td:first-child{width:56px;font-weight:700}
.scores{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:14px 0}
.scores div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--ground)}
.scores b{display:block;font-size:1.3rem}
.scores span{font-size:.85rem;color:var(--muted)}
h2{font-size:1.25rem;margin:0 0 10px}
h3{font-size:1.05rem;margin:18px 0 8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ground);padding:10px 18px;border-radius:8px;font-weight:600;max-width:90vw}
textarea.csv{width:100%;min-height:160px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
@media (max-width:560px){.qtext{font-size:1.55rem}.opt{font-size:1.25rem}.opts.two,.opts.three{grid-template-columns:1fr}.scores{grid-template-columns:repeat(2,minmax(0,1fr))}}
a.call{display:inline-block;margin-left:6px;font-weight:600;color:var(--teal)}
.sub{display:block;color:var(--muted);font-size:.85rem;font-weight:400}
.paper{background:#fff;color:#111;border:1px solid var(--line);border-radius:8px;padding:24px;font-size:15px;line-height:1.4}
.paper h2{color:#111;font-size:20px;margin:0 0 4px}
.paper table{min-width:0;font-size:14px}
.paper th,.paper td{border:1px solid #444;padding:6px 8px;color:#111}
.paper .box{display:inline-block;width:16px;height:16px;border:1.5px solid #111;vertical-align:-3px;margin:0 4px 0 10px}
.paper .blank{display:inline-block;min-width:150px;border-bottom:1px solid #111;height:18px;vertical-align:bottom}
.paper .meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 24px;margin:12px 0 16px}
.paper .hi{font-size:15px}
.paper .sec{font-weight:700;background:#eee}
@media print{
  @page{size:A4;margin:12mm}
  html{font-size:12pt}
  body{background:#fff}
  .noprint,header.top,#toast{display:none!important}
  .wrap{max-width:none;padding:0}
  .paper{border:none;padding:0;border-radius:0}
  .paper tr{break-inside:avoid}
  .pbreak{break-before:page}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>

const FIREBASE_CONFIG = {

  authDomain: "kap-palliative-hims.firebaseapp.com",
  projectId: "kap-palliative-hims",
  storageBucket: "kap-palliative-hims.firebasestorage.app",
  messagingSenderId: "14785045957",
  appId: "1:14785045957:web:a55b64a7a8da92b84617ac"
};

/* ---------- Instrument (Appendix A). Hindi is a DRAFT pending forward/back-translation. ---------- */
const ITEMS = [
  {id:'K1',dom:'K',type:'tf',key:'T',en:'Palliative care can be provided together with active cancer treatment.',hi:'उपशामक देखभाल (पैलिएटिव केयर) कैंसर के चल रहे इलाज के साथ-साथ दी जा सकती है।'},
  {id:'K2',dom:'K',type:'tf',key:'T',en:'The main focus of palliative care is relief of symptoms and stress.',hi:'उपशामक देखभाल का मुख्य उद्देश्य लक्षणों और तनाव से राहत देना है।'},
  {id:'K3',dom:'K',type:'tf',key:'F',en:'Palliative care is only for the last days of life.',hi:'उपशामक देखभाल केवल जीवन के अंतिम दिनों के लिए होती है।'},
  {id:'K4',dom:'K',type:'tf',key:'T',en:'Palliative care helps with problems like pain, breathlessness, nausea and poor sleep.',hi:'उपशामक देखभाल दर्द, सांस फूलना, जी मिचलाना और नींद न आने जैसी समस्याओं में मदद करती है।'},
  {id:'K5',dom:'K',type:'tf',key:'F',en:'Choosing palliative care means stopping cancer treatment.',hi:'उपशामक देखभाल चुनने का मतलब है कैंसर का इलाज बंद कर देना।'},
  {id:'K6',dom:'K',type:'tf',key:'T',en:'Palliative care can include help from a dietitian, a counsellor or a social worker.',hi:'उपशामक देखभाल में आहार विशेषज्ञ, परामर्शदाता (काउंसलर) या सामाजिक कार्यकर्ता की मदद भी शामिल हो सकती है।'},
  {id:'K7',dom:'K',type:'tf',key:'T',en:"Palliative care also supports the patient's family.",hi:'उपशामक देखभाल मरीज़ के परिवार को भी सहारा देती है।'},
  {id:'K8',dom:'K',type:'tf',key:'T',en:'Patients can tell their care team in advance what kind of care they want.',hi:'मरीज़ पहले से अपनी देखभाल टीम को बता सकते हैं कि वे किस तरह की देखभाल चाहते हैं।'},
  {id:'A1',dom:'A',type:'lik',en:'I feel comfortable asking my doctor about palliative/supportive care.',hi:'मुझे अपने डॉक्टर से उपशामक/सहायक देखभाल के बारे में पूछने में सहजता महसूस होती है।'},
  {id:'A2',dom:'A',type:'lik',en:'Early information about care preferences is helpful for me and my family.',hi:'देखभाल की प्राथमिकताओं के बारे में जल्दी जानकारी मिलना मेरे और मेरे परिवार के लिए सहायक है।'},
  {id:'A3',dom:'A',type:'lik',en:'I would like my family to be involved when discussing what matters to me.',hi:'जब मेरे लिए महत्वपूर्ण बातों पर चर्चा हो, तो मैं चाहूँगा/चाहूँगी कि मेरा परिवार भी शामिल हो।'},
  {id:'A4',dom:'A',type:'lik',en:'I would accept a referral to the palliative care team if my doctor suggested it.',hi:'अगर मेरे डॉक्टर सलाह दें, तो मैं उपशामक देखभाल टीम के पास भेजे जाने (रेफ़रल) को स्वीकार करूँगा/करूँगी।'},
  {id:'A5',dom:'A',type:'lik',rev:true,en:'Talking about palliative care would make me lose hope.',hi:'उपशामक देखभाल के बारे में बात करने से मेरी उम्मीद टूट जाएगी।'},
  {id:'P1',dom:'P',type:'yn',en:'I would like written information on palliative/supportive care.',hi:'मुझे उपशामक/सहायक देखभाल के बारे में लिखित जानकारी चाहिए।'},
  {id:'P2',dom:'P',type:'yn',en:'I plan to speak with my doctor about my care preferences in the coming weeks.',hi:'मैं आने वाले हफ़्तों में अपनी देखभाल की प्राथमिकताओं के बारे में अपने डॉक्टर से बात करने की योजना बना रहा/रही हूँ।'},
  {id:'P3',dom:'P',type:'yn',en:'I plan to speak with my family about my care preferences in the coming weeks.',hi:'मैं आने वाले हफ़्तों में अपनी देखभाल की प्राथमिकताओं के बारे में अपने परिवार से बात करने की योजना बना रहा/रही हूँ।'}
];
const PRIOR = {id:'PRIOR',en:'Had you heard of palliative care before today?',hi:'क्या आपने आज से पहले उपशामक देखभाल (पैलिएटिव केयर) के बारे में सुना था?'};
const T1X = [
  {id:'RECALL',en:'Did you watch the video about palliative care in the waiting room?',hi:'क्या आपने प्रतीक्षालय में उपशामक देखभाल के बारे में वीडियो देखा था?'},
  {id:'QPLUSE',en:'After getting the question card, did you ask your doctor or nurse any of the questions on it?',hi:'प्रश्न कार्ड मिलने के बाद, क्या आपने अपने डॉक्टर या नर्स से उस पर लिखा कोई प्रश्न पूछा?'}
];
const ACCEPT = {id:'ACC',en:'How useful did you find the video and the question card?',hi:'आपको वीडियो और प्रश्न कार्ड कितने उपयोगी लगे?',
  opts:{en:['Not useful at all','Slightly useful','Moderately useful','Very useful','Extremely useful'],hi:['बिल्कुल उपयोगी नहीं','थोड़े उपयोगी','कुछ हद तक उपयोगी','काफ़ी उपयोगी','बहुत अधिक उपयोगी']}};
const OPTS = {
  tf:{en:[['T','True'],['F','False'],['DK',"Don't know"]],hi:[['T','सही'],['F','गलत'],['DK','पता नहीं']]},
  yn:{en:[['Y','Yes'],['N','No']],hi:[['Y','हाँ'],['N','नहीं']]},
  lik:{en:[[1,'Strongly disagree'],[2,'Disagree'],[3,'Neither agree nor disagree'],[4,'Agree'],[5,'Strongly agree']],
       hi:[[1,'पूरी तरह असहमत'],[2,'असहमत'],[3,'न सहमत, न असहमत'],[4,'सहमत'],[5,'पूरी तरह सहमत']]}
};
const DOM_NAME = {K:{en:'Knowledge',hi:'ज्ञान'},A:{en:'Attitude',hi:'दृष्टिकोण'},P:{en:'Practice / intent',hi:'व्यवहार / इरादा'}};
const SKIP = 'SKIP';
const H = 3600e3;

/* ---------- scoring ---------- */
function itemScore(it, v){
  if(v===undefined||v===null||v===SKIP) return null;
  if(it.type==='tf') return v===it.key?1:0;
  if(it.type==='yn') return v==='Y'?1:0;
  return it.rev?6-Number(v):Number(v);
}
function score(ans){
  const out={K:0,A:0,P:0}; const miss={K:0,A:0,P:0};
  for(const it of ITEMS){const s=itemScore(it,ans?.[it.id]); if(s===null) miss[it.dom]++; else out[it.dom]+=s;}
  const r={K:miss.K?null:out.K,A:miss.A?null:out.A,P:miss.P?null:out.P};
  r.total=(r.K===null||r.A===null||r.P===null)?null:r.K+r.A+r.P;
  r.missing=miss.K+miss.A+miss.P;
  return r;
}

/* ---------- helpers ---------- */
const $app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDT=ms=>{if(!ms)return '';const d=new Date(ms);return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});};
const toLocalInput=ms=>{const d=new Date(ms);const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;};
const sgn=n=>n===null||n===undefined?'–':(n>0?'+':'')+(Math.round(n*10)/10);
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600);}

/* ---------- state ---------- */
const S={email:'',contacts:{},pending:new Set(),unsub:[],db:null,dbState:'loading',canWrite:true,downloads:null,parts:{},view:'list',sel:null,form:null,lang:'en',csv:null};

function t1Status(p){
  if(p.status==='withdrawn') return {cls:'p-done',txt:'Withdrawn'};
  if(!p.t0) return {cls:'p-amber',txt:'T0 not done'};
  if(p.t1){const h=(p.t1.at-p.t0.at)/H;return {cls:'p-done',txt:`Done at ${Math.round(h)} h`+(h<48||h>72?' (outside window)':'')};}
  const now=Date.now(), open=p.t0.at+48*H, close=p.t0.at+72*H;
  if(now<open) return {cls:'p-wait',txt:`Opens in ${Math.ceil((open-now)/H)} h`,when:open};
  if(now<=close) return {cls:'p-due',txt:`Due now, closes in ${Math.ceil((close-now)/H)} h`,due:true};
  return {cls:'p-late',txt:`Overdue by ${Math.floor((now-close)/H)} h`,late:true};
}

/* ---------- views ---------- */
function render(){
  if(['loading','signin','denied','config','offline'].includes(S.dbState)) return renderGate();
  if(S.view==='form') return renderForm();
  if(S.view==='exposure') return renderExposure();
  if(S.view==='detail') return renderDetail();
  if(S.view==='export') return renderExport();
  if(S.view==='pdetails') return renderPDetails();
  if(S.view==='paper') return renderPaper();
  renderList();
}

function header(sub){
  return `<header class="top"><div><h1>KAP Recorder</h1><p>${sub}</p></div><div class="row">${S.view!=='list'?'<button class="btn ghost" data-act="home">Back to participants</button>':''}${S.email?`<span style="color:var(--muted);font-size:.9rem">${esc(S.email)}</span><button class="linkbtn" data-act="signout">Sign out</button>`:''}</div></header>`;
}
function renderGate(){
  let body='';
  if(S.dbState==='loading') body='<p class="empty">Loading…</p>';

  else if(S.dbState==='offline') body=`<div class="card"><h2>Can't reach Firebase</h2><p>The Firebase scripts did not load. Check the internet connection and reload the page.</p></div>`;
  else if(S.dbState==='signin') body=`<div class="card"><h2>Sign in to record data</h2><p>Use the Google account that is on this study's access list.</p><div class="row" style="margin-top:12px"><button class="btn" data-act="signin">Sign in with Google</button></div></div>`;

  const paired=active.filter(p=>p.t0&&p.t1).map(p=>[score(p.t0.ans).total,score(p.t1.ans).total]).filter(([a,b])=>a!==null&&b!==null);

  $app.innerHTML=header('Palliative care KAP study, Oncology OPD, HIMS. Single-arm pre–post, T0 and T1 at 48–72 h.')+warn+
  `<p class="note"><strong>Patient details are kept apart from the answers.</strong> Names, UHID and phone numbers download only in the separate contact list. The research CSV carries the study code, age and sex, nothing more.</p>
  <div class="stats">
    <div class="stat"><b>${active.length}</b><span>Enrolled (target 50)</span></div>
    <div class="stat"><b>${t0n}</b><span>T0 done</span></div>
    <div class="stat"><b>${t1n}</b><span>T1 done (need 34 paired)</span></div>
    <div class="stat"><b>${due}</b><span>T1 due now</span></div>
    <div class="stat"><b>${late}</b><span>T1 overdue</span></div>
    <div class="stat"><b>${sgn(meanCh)}</b><span>Mean total change, ${paired.length} complete pairs</span></div>
  </div>
  <div class="row" style="justify-content:space-between;margin-bottom:12px">
    <button class="btn" data-act="enrol" ${S.dbState!=='ok'||!S.canWrite?'disabled':''}>Enrol new participant and start T0</button>
    <div class="row"><button class="btn ghost" data-act="paper">Paper questionnaire</button><button class="btn ghost" data-act="export" ${list.length?'':'disabled'}>Export CSV</button></div>
  </div>
  <div class="tablewrap">${list.length?`<table><thead><tr><th>Code</th><th>T0</th><th>Exposure</th><th>T1</th><th class="num">T0 total</th><th class="num">T1 total</th><th class="num">Change</th><th>Actions</th></tr></thead><tbody>${list.map(rowHTML).join('')}</tbody></table>`:
  `<p class="empty">${S.dbState==='loading'?'Loading records…':'No participants yet. Enrol the first one after consent is signed.'}</p>`}</div>
  <p style="color:var(--muted);font-size:.9rem;margin-top:12px">Scores: Knowledge 0–8 (K3 and K5 are false statements; "Don't know" scores 0), Attitude 5–25 (A5 reverse-scored), Practice 0–3, Total 5–36. A domain with a skipped item has no score, and neither does the total.</p>`;
}
function rowHTML(p){
  const st=t1Status(p), s0=p.t0?score(p.t0.ans):null, s1=p.t1?score(p.t1.ans):null;
  const ch=s0&&s1&&s0.total!==null&&s1.total!==null?s1.total-s0.total:null;
  const exp=p.exposure?(p.exposure.video==='Y'?'Recorded':'<span class="pill p-amber">Video not seen</span>'):(p.t0?'<span class="pill p-amber">Pending</span>':'–');
  const can=S.dbState==='ok'&&S.canWrite&&p.status!=='withdrawn';
  let acts=`<button class="linkbtn" data-act="detail" data-code="${esc(p.code)}">View</button>`;
  if(can&&!p.t0) acts+=` <button class="linkbtn" data-act="t0" data-code="${esc(p.code)}">Record T0</button>`;
  if(can&&p.t0&&!p.exposure) acts+=` <button class="linkbtn" data-act="exposure" data-code="${esc(p.code)}">Record exposure</button>`;
  if(can&&p.t0&&!p.t1) acts+=` <button class="linkbtn" data-act="t1" data-code="${esc(p.code)}">Record T1</button>`;
  if(S.dbState==='ok'&&S.canWrite) acts+=` <button class="linkbtn" style="color:var(--red)" data-act="delete" data-code="${esc(p.code)}">Delete</button>`;
  const c=S.contacts[p.code]||{};
  const call=(st.due||st.late)&&c.mobile?`<a class="call" href="tel:${esc(c.mobile.replace(/[^\d+]/g,''))}">Call ${esc(c.mobile)}</a>`:'';
  return `<tr><td><b>${esc(p.code)}</b>${S.pending.has(p.code)?' <span class="pill p-amber">Not uploaded</span>':''}${c.name?`<span class="sub">${esc(c.name)}</span>`:''}</td><td>${p.t0?fmtDT(p.t0.at):'–'}</td><td>${exp}</td><td><span class="pill ${st.cls}">${esc(st.txt)}</span>${call}</td>
  <td class="num">${s0?.total??'–'}</td><td class="num">${s1?.total??'–'}</td><td class="num">${sgn(ch)}</td><td>${acts}</td></tr>`;
}

/* questionnaire: the step list differs by timepoint; the 16 KAP items are identical at T0 and T1 */
function qsteps(tp){
  const a=[{k:'setup'}];
  if(tp==='t0') a.push({k:'x',x:PRIOR,label:{en:'Before the questions',hi:'प्रश्नों से पहले'}});
  ITEMS.forEach(it=>a.push({k:'item',it}));
  if(tp==='t1'){T1X.forEach(x=>a.push({k:'x',x,label:{en:'Follow-up',hi:'फ़ॉलो-अप'}}));a.push({k:'acc'});}
  a.push({k:'review'});
  return a;
}
function stepId(st){return st.k==='item'?st.it.id:st.k==='x'?st.x.id:st.k==='acc'?'ACC':null;}
function startForm(code,tp){
  S.form={code,tp,step:0,at:Date.now(),mode:tp==='t0'?'in-person':'phone',by:'',ans:{}};
  S.lang='en'; S.view='form'; render(); window.scrollTo(0,0);
}
function steps(){return qsteps(S.form.tp).length;}
function ansLabel(id,v){
  if(v===undefined) return '–';
  if(v===SKIP) return '<span class="pill p-amber">Skipped</span>';
  const it=ITEMS.find(x=>x.id===id);
  if(it) return esc((OPTS[it.type].en.find(o=>String(o[0])===String(v))||[,''])[1]);
  if(id==='ACC') return esc(v+' – '+ACCEPT.opts.en[v-1]);
  return v==='Y'?'Yes':v==='N'?'No':esc(v);
}
function renderForm(){
  const f=S.form, list=qsteps(f.tp), n=list.length, st=list[f.step], L=S.lang, p=S.parts[f.code];
  const tpName=f.tp==='t0'?'T0 baseline (before the video)':'T1 follow-up (48–72 h)';
  let body='';
  const langT=`<div class="lang" role="group" aria-label="Question language"><button data-act="lang" data-v="en" aria-pressed="${L==='en'}">English</button><button data-act="lang" data-v="hi" aria-pressed="${L==='hi'}" lang="hi">हिंदी</button></div>`;
  const nav=(v)=>`<div class="qnav"><button class="btn ghost" data-act="prev">Previous</button>
      <button class="linkbtn" data-act="ans" data-v="${SKIP}" aria-pressed="${v===SKIP}">${v===SKIP?'Skipped. Tap an answer to change.':'Skip this question'}</button>
      <button class="btn" data-act="next" ${v===undefined?'disabled':''}>Next</button></div>`;
  const optBtns=(opts,v,numbered)=>opts.map(([val,lab],i)=>`<button class="opt" data-act="ans" data-v="${val}" aria-pressed="${String(v)===String(val)}" lang="${L}"><span class="k">${numbered?val:(i+1)}</span>${esc(lab)}</button>`).join('');
  if(st.k==='setup'){
    let winNote='';
    if(f.tp==='t1'&&p?.t0){const h=(f.at-p.t0.at)/H; if(h<48||h>72) winNote=`<p class="note"><strong>Outside the 48–72 h window.</strong> This time is ${Math.round(h)} h after T0. You can still record it; the export flags it.</p>`;}
    body=`<div class="card"><h2>Before you start</h2>${winNote}
    <div class="fgrid">
      <label class="f">Date and time of this interview<input type="datetime-local" id="f-at" value="${toLocalInput(f.at)}"></label>
      <label class="f">Your initials<input id="f-by" maxlength="8" autocomplete="off" value="${esc(f.by)}" placeholder="e.g. SS"></label>
      <div class="f" style="display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.95rem">How it is being done<div class="seg" role="group" aria-label="Mode"><button data-act="mode" data-v="in-person" aria-pressed="${f.mode==='in-person'}">In person</button><button data-act="mode" data-v="phone" aria-pressed="${f.mode==='phone'}">By phone</button></div></div>
    </div>
    <p style="color:var(--muted);margin:16px 0 0">Choose the language the participant prefers, using the switch above. Read each statement exactly as written. If the participant doesn't want to answer, use "Skip this question". Don't tell the participant whether an answer was right.</p>
    <div class="qnav"><span></span><button class="btn" data-act="next">Start questions</button></div></div>`;
  } else if(st.k==='item'){
    const it=st.it, v=f.ans[it.id];
    body=`<div class="card"><p class="domain">${it.id} · ${DOM_NAME[it.dom][L]}</p><p class="qtext" lang="${L}">${esc(it[L])}</p>
      <div class="opts ${it.type==='lik'?'':it.type==='tf'?'three':'two'}">${optBtns(OPTS[it.type][L],v,it.type==='lik')}</div>${nav(v)}</div>`;
  } else if(st.k==='x'){
    const v=f.ans[st.x.id];
    body=`<div class="card"><p class="domain">${st.label[L]}</p><p class="qtext" lang="${L}">${esc(st.x[L])}</p>
      <div class="opts two">${optBtns(OPTS.yn[L],v,false)}</div>${nav(v)}</div>`;

    const v=f.ans.ACC;
    body=`<div class="card"><p class="domain">${L==='hi'?'उपयोगिता':'Acceptability'}</p><p class="qtext" lang="${L}">${esc(ACCEPT[L])}</p>
      <div class="opts">${optBtns(ACCEPT.opts[L].map((lab,i)=>[i+1,lab]),v,true)}</div>${nav(v)}</div>`;
  } else {
    const sc=score(f.ans);
    const row=(id,text)=>{const idx=list.findIndex(x=>stepId(x)===id);return `<tr><td>${id}</td><td>${esc(text)}</td><td>${ansLabel(id,f.ans[id])}</td><td><button class="linkbtn" data-act="goto" data-v="${idx}">Change</button></td></tr>`;};
    const extra=list.filter(x=>x.k==='x'||x.k==='acc').map(x=>row(stepId(x),x.k==='acc'?ACCEPT.en:x.x.en)).join('');
    body=`<div class="card"><h2>Check and save</h2>
    <div class="scores"><div><b>${sc.K??'–'}</b><span>Knowledge /8</span></div><div><b>${sc.A??'–'}</b><span>Attitude /25</span></div><div><b>${sc.P??'–'}</b><span>Practice /3</span></div><div><b>${sc.total??'–'}</b><span>Total /36</span></div></div>

    <div class="qnav"><button class="btn ghost" data-act="prev">Previous</button><button class="btn" data-act="save">Save ${f.tp.toUpperCase()}</button></div></div>`;
  }
  $app.innerHTML=`<div class="qhead"><div><div class="who">${esc(f.code)} · ${tpName}</div><div style="color:var(--muted);font-size:.9rem">Step ${f.step+1} of ${n}</div></div>${langT}</div>
  <div class="progress" aria-hidden="true"><i style="width:${Math.round((f.step+1)/n*100)}%"></i></div>${body}
  <div style="margin-top:14px"><button class="linkbtn" data-act="cancel">Cancel without saving</button></div>`;
}

async function saveDetails(btn){
  const g=id=>document.getElementById(id).value.trim();
  const code=S.form.code, name=g('d-name'), uhid=g('d-uhid'), mobile=g('d-mob'), altMobile=g('d-alt'), age=g('d-age');
  const sex=document.querySelector('[data-act="sex"][aria-pressed="true"]')?.dataset.v||'';
  const digits=x=>x.replace(/\D/g,'').replace(/^91(?=\d{10}$)/,'').replace(/^0(?=\d{10}$)/,'');
  if(!name){toast("Enter the patient's name.");document.getElementById('d-name').focus();return;}
  if(mobile&&digits(mobile).length!==10){toast('The mobile number should have 10 digits.');document.getElementById('d-mob').focus();return;}
  if(altMobile&&digits(altMobile).length!==10){toast("The relative's mobile should have 10 digits.");document.getElementById('d-alt').focus();return;}
  if(age&&(isNaN(+age)||+age<18||+age>110)){toast('Age should be between 18 and 110.');return;}
  btn.disabled=true;
  const cw=S.db.doc('contacts/'+code).set({code,name,uhid,mobile:mobile?digits(mobile):'',altMobile:altMobile?digits(altMobile):'',updatedAt:Date.now()});
  cw.catch(onWriteError);
  S.contacts[code]={code,name,uhid,mobile:mobile?digits(mobile):'',altMobile:altMobile?digits(altMobile):''};
  const p=S.parts[code]||{code,status:'active'};
  const ok=await put(code,{...p,demo:{age:age?Number(age):null,sex}});
  if(!ok){btn.disabled=false;return;}
  toast('Patient details saved for '+code);
  if(S.form.then==='t0') startForm(code,'t0'); else {S.sel=code;S.view='detail';S.form=null;render();}
}

/* ---------- paper questionnaire ---------- */
function renderPaper(){
  const L=OPTS.lik;
  const ansCell=it=>it.type==='tf'?`<span class="box"></span>True / सही<span class="box"></span>False / गलत<span class="box"></span>Don't know / पता नहीं`
    :it.type==='yn'?`<span class="box"></span>Yes / हाँ<span class="box"></span>No / नहीं`
    :L.en.map(([v])=>`<span class="box"></span>${v}`).join('');
  const rowsFor=dom=>ITEMS.filter(it=>it.dom===dom).map(it=>`<tr><td><b>${it.id}</b></td><td>${esc(it.en)}<div class="hi" lang="hi">${esc(it.hi)}</div></td><td style="white-space:nowrap">${ansCell(it)}</td></tr>`).join('');
  const ynRow=x=>`<tr><td><b>${x.id}</b></td><td>${esc(x.en)}<div class="hi" lang="hi">${esc(x.hi)}</div></td><td style="white-space:nowrap"><span class="box"></span>Yes / हाँ<span class="box"></span>No / नहीं</td></tr>`;
  const likKey=L.en.map(([v,t],i)=>`${v} = ${t} / <span lang="hi">${L.hi[i][1]}</span>`).join('; ');
  const accRow=`<tr><td><b>ACC</b></td><td>${esc(ACCEPT.en)}<div class="hi" lang="hi">${esc(ACCEPT.hi)}</div><div style="font-size:13px;margin-top:4px">${ACCEPT.opts.en.map((t,i)=>`${i+1} = ${t}`).join('; ')}</div></td><td style="white-space:nowrap">${[1,2,3,4,5].map(v=>`<span class="box"></span>${v}`).join('')}</td></tr>`;
  $app.innerHTML=header('Paper questionnaire')+`
  <div class="noprint card" style="margin-bottom:16px"><p style="margin:0 0 10px">Print this, or save it as a PDF to keep on the phone. Use it when the internet is down. Enter the answers in the tool later, and set the interview's real date and time on the first screen.</p>
  <div class="row"><button class="btn" data-act="print">Print or save as PDF</button></div></div>
  <div class="paper">
    <h2>KAP Questionnaire: Palliative / Supportive Care</h2>
    <div>Oncology OPD, HIMS, SRHU, Dehradun</div>
    <div class="meta">
      <div>Study code: <span class="blank"></span></div>
      <div>Timepoint:<span class="box"></span>T0 (before video)<span class="box"></span>T1 (48–72 h)</div>
      <div>Date: <span class="blank" style="min-width:110px"></span> Time: <span class="blank" style="min-width:70px"></span></div>
      <div>Mode:<span class="box"></span>In person<span class="box"></span>By phone</div>
      <div>Language used:<span class="box"></span>English<span class="box"></span>Hindi</div>
      <div>Interviewer initials: <span class="blank" style="min-width:80px"></span></div>
    </div>
    <table><tbody>
      <tr class="sec"><td colspan="3">Patient details (T0 only; leave blank at T1)</td></tr>
      <tr><td colspan="3">Name: <span class="blank" style="min-width:260px"></span>&nbsp; UHID / CR no.: <span class="blank"></span></td></tr>
      <tr><td colspan="3">Mobile: <span class="blank"></span>&nbsp; Relative's mobile: <span class="blank"></span></td></tr>
      <tr><td colspan="3">Age: <span class="blank" style="min-width:60px"></span> years &nbsp; Sex:<span class="box"></span>Male<span class="box"></span>Female<span class="box"></span>Other</td></tr>
    </tbody></table>
    <p style="margin:14px 0 6px">Read each statement exactly as written. Tick one box. If the participant chooses not to answer, write "skip". Don't tell the participant whether an answer was right.</p>
    <table>
      <thead><tr><th style="width:52px">Item</th><th>Statement / कथन</th><th>Answer</th></tr></thead>
      <tbody>
        <tr class="sec"><td colspan="3">T0 only: before the questions</td></tr>
        ${ynRow(PRIOR)}
        <tr class="sec"><td colspan="3">Knowledge / ज्ञान</td></tr>
        ${rowsFor('K')}
        <tr class="sec"><td colspan="3">Attitude / दृष्टिकोण &nbsp; <span style="font-weight:400;font-size:13px">${likKey}</span></td></tr>
        ${rowsFor('A')}
        <tr class="sec"><td colspan="3">Practice / intent / व्यवहार / इरादा</td></tr>
        ${rowsFor('P')}
        <tr class="sec"><td colspan="3">T1 only: follow-up</td></tr>
        ${T1X.map(ynRow).join('')}
        ${accRow}
      </tbody>
    </table>
    <p style="margin-top:12px;font-size:13px">Hindi wording is a draft, pending forward and back-translation.</p>
  </div>`;
}

/* ---------- CSV ---------- */
function buildCSV(){
  const cols=['code','status','age','sex','t0_datetime','t0_mode','t0_by','t0_lang','t0_PRIOR',...ITEMS.map(i=>'t0_'+i.id),'t0_K','t0_A','t0_P','t0_total','t0_missing',
    'exp_video','exp_qpl_offered','exp_qpl_accepted','exp_requested_discussion','exp_notes',
    't1_datetime','t1_hours_after_t0','t1_in_window','t1_mode','t1_by','t1_lang',...ITEMS.map(i=>'t1_'+i.id),'t1_K','t1_A','t1_P','t1_total','t1_missing','t1_RECALL','t1_QPLUSE','t1_acceptability',
    'chg_K','chg_A','chg_P','chg_total'];
  const raw=(it,v)=>v===undefined?'':v===SKIP?'':it.type==='tf'?(v==='T'?1:v==='F'?0:9):it.type==='yn'?(v==='Y'?1:0):v;
  const yn=v=>v==='Y'?1:v==='N'?0:'';
  const iso=ms=>ms?new Date(ms).toISOString():'';
  const q=v=>{v=v===null||v===undefined?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const rows=Object.values(S.parts).sort((a,b)=>a.code.localeCompare(b.code)).map(p=>{
    const s0=p.t0?score(p.t0.ans):{}, s1=p.t1?score(p.t1.ans):{}, e=p.exposure||{};
    const h=p.t0&&p.t1?(p.t1.at-p.t0.at)/H:null;
    const d=k=>(s0[k]!=null&&s1[k]!=null)?s1[k]-s0[k]:'';
    return [p.code,p.status||'active',p.demo?.age??'',p.demo?.sex??'',iso(p.t0?.at),p.t0?.mode,p.t0?.by,p.t0?.lang,yn(p.t0?.ans?.PRIOR),...ITEMS.map(i=>raw(i,p.t0?.ans?.[i.id])),s0.K,s0.A,s0.P,s0.total,p.t0?s0.missing:'',
      e.video,e.qplOffered,e.qplAccepted,e.discussion,e.notes,
      iso(p.t1?.at),h===null?'':h.toFixed(1),h===null?'':(h>=48&&h<=72?1:0),p.t1?.mode,p.t1?.by,p.t1?.lang,...ITEMS.map(i=>raw(i,p.t1?.ans?.[i.id])),s1.K,s1.A,s1.P,s1.total,p.t1?s1.missing:'',yn(p.t1?.ans?.RECALL),yn(p.t1?.ans?.QPLUSE),p.t1?(p.t1.acc===SKIP||p.t1.acc==null?'':p.t1.acc):'',
      d('K'),d('A'),d('P'),d('total')].map(q).join(',');
  });
  return [cols.join(','),...rows].join('\n');
}
function buildContactsCSV(){
  const q=v=>{v=v===null||v===undefined?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const rows=Object.values(S.parts).sort((a,b)=>a.code.localeCompare(b.code)).map(p=>{const c=S.contacts[p.code]||{};return [p.code,c.name,c.uhid,c.mobile,c.altMobile,p.demo?.age,p.demo?.sex,p.status||'active'].map(q).join(',');});
  return ['code,name,uhid_cr_no,mobile,relative_mobile,age,sex,status',...rows].join('\n');
}
function saveFile(name,text){const blob=new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);}
function renderExport(){
  $app.innerHTML=header('Export')+`<div class="card"><p>One row per participant. Item columns hold the raw answer, before scoring. Knowledge: 1 = True, 0 = False, 9 = Don't know. Attitude: 1 to 5 as ticked (A5 is reversed only in the scores). Yes/No questions: 1 = Yes, 0 = No. Skipped items are blank. Domain and total columns are the scored values. Change = T1 minus T0.</p>
  <div class="row" style="margin:12px 0"><button class="btn" data-act="dl">Download research CSV</button><button class="btn ghost" data-act="sel">Select all text</button></div>
  <p style="margin-top:18px"><b>Contact list.</b> Names, UHID and phone numbers, linked by study code. Keep this file off GitHub and off shared drives that others can open.</p>
  <div class="row" style="margin:8px 0 14px"><button class="btn ghost" data-act="dlcontacts">Download contact list</button></div>
  <textarea class="csv" id="csv" readonly aria-label="CSV data">${esc(S.csv)}</textarea></div>`;
}

/* ---------- db writes ---------- */
async function put(code,data){
  const w=S.db.doc('participants/'+code).set(data);
  try{
    const r=await Promise.race([w.then(()=> 'ok'),new Promise(res=>setTimeout(()=>res('queued'),5000))]);
    if(r==='queued'){toast('No internet. Saved on this device; it will upload when the connection is back.');w.catch(onWriteError);}
    return true;
  }catch(e){onWriteError(e);return false;}
}
function onWriteError(e){
  if(e?.code==='permission-denied') toast('This account is not allowed to save. Check the access list.');
  else if(e?.code==='resource-exhausted') toast('Firebase free quota reached for today. Try again tomorrow.');
  else toast('Could not save. Check the connection and try again.');
}
async function enrol(){
  const nums=Object.keys(S.parts).map(c=>parseInt(c.replace(/\D/g,''),10)).filter(n=>!isNaN(n));
  let n=(nums.length?Math.max(...nums):0)+1, code;
  for(let i=0;i<20;i++){code='KAP-'+String(n).padStart(3,'0');const s=await S.db.doc('participants/'+code).get();if(!s.exists)break;n++;}
  const ok=await put(code,{code,status:'active',createdAt:Date.now()});
  if(ok){S.parts[code]=S.parts[code]||{code,status:'active'};toast(code+' enrolled. Write this code on the consent form.');S.form={code,then:'t0'};S.view='pdetails';render();window.scrollTo(0,0);}
}

/* ---------- events ---------- */
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-act]'); if(!b||b.disabled) return;
  const a=b.dataset.act, v=b.dataset.v, f=S.form;
  const keepFields=()=>{const at=document.getElementById('f-at'),by=document.getElementById('f-by');if(at&&at.value)f.at=new Date(at.value).getTime();if(by)f.by=by.value.trim();};
  switch(a){
    case 'home': S.view='list';S.form=null;render();break;
    case 'detailback': S.view='detail';S.form=null;render();break;
    case 'enrol': b.disabled=true; await enrol(); break;
    case 'export': S.csv=buildCSV();S.view='export';render();break;
    case 'dl': saveFile('kap_data_'+new Date().toISOString().slice(0,10)+'.csv',S.csv);break;
    case 'dlcontacts': saveFile('kap_contacts_'+new Date().toISOString().slice(0,10)+'.csv',buildContactsCSV());break;
    case 'paper': S.view='paper';render();window.scrollTo(0,0);break;
    case 'print': window.print();break;
    case 'editdetails': S.form={code:S.sel,then:'detail'};S.view='pdetails';render();break;
    case 'savedetails': await saveDetails(b);break;
    case 'skipdetails': {const code=S.form.code;startForm(code,'t0');break;}
    case 'deldetails': if(confirm('Delete the name, UHID and phone numbers for '+S.sel+'? The answers stay.')){try{const dw=S.db.doc('contacts/'+S.sel).delete();await Promise.race([dw,new Promise(r=>setTimeout(r,5000))]);dw.catch(onWriteError);delete S.contacts[S.sel];render();toast('Patient details deleted for '+S.sel);}catch(e){toast('Could not delete.');}}break;
    case 'sex': {document.querySelectorAll('[data-act="sex"]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));break;}
    case 'signin': {const prov=new firebase.auth.GoogleAuthProvider();try{await firebase.auth().signInWithPopup(prov);}catch(e){if(e?.code==='auth/popup-blocked'||e?.code==='auth/operation-not-supported-in-this-environment')firebase.auth().signInWithRedirect(prov);else if(e?.code!=='auth/popup-closed-by-user'&&e?.code!=='auth/cancelled-popup-request')toast('Sign-in failed: '+(e?.code||'unknown error'));}break;}
    case 'signout': if(S.view==='form'&&!confirm('Sign out? Unsaved answers on this screen will be lost.'))break; await firebase.auth().signOut(); S.view='list';S.form=null; break;
    case 'sel': {const t=document.getElementById('csv');t.focus();t.select();break;}
    case 'detail': S.sel=b.dataset.code;S.view='detail';render();break;
    case 't0': case 't1': {
      const code=b.dataset.code, p=S.parts[code];
      if(p?.[a]&&!confirm(`This replaces the saved ${a.toUpperCase()} for ${code}. Continue?`)) break;
      startForm(code,a);break;}
    case 'exposure': S.sel=b.dataset.code;S.form={video:null,qplOffered:null,qplAccepted:null,discussion:null,notes:'',by:''};S.view='exposure';render();break;
    case 'exp': S.form.notes=document.getElementById('e-notes').value;S.form.by=document.getElementById('e-by').value.trim();S.form[b.dataset.k]=v;render();break;
    case 'saveexp': {
      f.notes=document.getElementById('e-notes').value.trim();f.by=document.getElementById('e-by').value.trim();
      const p=S.parts[S.sel]; const data={...p,exposure:{...f,at:Date.now()}};
      if(await put(S.sel,data)){toast('Checklist saved for '+S.sel);S.view='list';render();}break;}
    case 'lang': if(S.view==='form'&&f.step===0)keepFields(); S.lang=v;render();break;
    case 'mode': keepFields();f.mode=v;render();break;
    case 'ans': {const st=qsteps(f.tp)[f.step], id=stepId(st);
      const num=(st.k==='item'&&st.it.type==='lik')||st.k==='acc';
      f.ans[id]=v===SKIP?SKIP:(num?Number(v):v);render();
      setTimeout(()=>{if(S.view==='form'&&S.form===f&&f.step<steps()-1){f.step++;render();}},v===SKIP?0:220);break;}
    case 'prev': if(f.step>0){f.step--;render();}break;
    case 'next':
      if(f.step===0){keepFields(); if(!f.by){toast('Enter your initials first.');document.getElementById('f-by')?.focus();break;} if(isNaN(f.at)){toast('Enter a valid date and time.');break;}}
      if(f.step<steps()-1){f.step++;render();window.scrollTo(0,0);}break;
    case 'goto': f.step=Number(v);render();break;
    case 'cancel': if(confirm('Leave without saving? The answers on this screen will be lost.')){S.view='list';S.form=null;render();}break;
    case 'save': {
      const p=S.parts[f.code]||{code:f.code,status:'active'};
      const ans={...f.ans}; const rec={at:f.at,mode:f.mode,by:f.by,lang:S.lang,ans};
      if(f.tp==='t1'){rec.acc=ans.ACC===undefined?null:ans.ACC;delete ans.ACC;}
      b.disabled=true;
      if(await put(f.code,{...p,[f.tp]:rec})){toast(`${f.tp.toUpperCase()} saved for ${f.code}`+(f.tp==='t0'?'. Now show the video and offer the QPL card.':''));S.view='list';S.form=null;render();}
      else b.disabled=false;
      break;}
    case 'withdraw': if(confirm('Mark '+S.sel+' as withdrawn? The record is kept but excluded from counts.')){const p=S.parts[S.sel];if(await put(S.sel,{...p,status:'withdrawn',withdrawnAt:Date.now()}))render();}break;
    case 'reinstate': {const p={...S.parts[S.sel],status:'active'};delete p.withdrawnAt;if(await put(S.sel,p))render();break;}
    case 'delete': {const code=b.dataset.code||S.sel;
      if(confirm('Delete the whole record for '+code+' (patient details, T0, exposure checklist and T1)? This cannot be undone.')){try{const dw=S.db.doc('participants/'+code).delete();const dc=S.db.doc('contacts/'+code).delete();await Promise.race([Promise.all([dw,dc]),new Promise(r=>setTimeout(r,5000))]);dw.catch(onWriteError);dc.catch(()=>{});delete S.parts[code];delete S.contacts[code];S.view='list';render();toast(code+' deleted');}catch(e){toast('Could not delete. Check the connection and try again.');}}break;}
    case 'delpart': {const names={t0:'T0',t1:'T1',exposure:'exposure checklist'};
      const warn=v==='t0'&&S.parts[S.sel]?.t1?' The T1 answers stay, but there will be no change score until T0 is recorded again.':'';
      if(confirm('Delete the '+names[v]+' for '+S.sel+'? This cannot be undone.'+warn)){const p={...S.parts[S.sel]};delete p[v];if(await put(S.sel,p)){S.parts[S.sel]=p;render();toast(names[v]+' deleted for '+S.sel);}}break;}
  }
});
document.addEventListener('input',ev=>{
  if(ev.target.id==='e-by'){const btn=document.querySelector('[data-act="saveexp"]');S.form.by=ev.target.value.trim();if(btn)btn.disabled=!(['video','qplOffered','qplAccepted','discussion'].every(k=>S.form[k])&&S.form.by);}
});

/* ---------- boot ---------- */
render();
(function boot(){
  if(typeof firebase==='undefined'){S.dbState='offline';render();return;}
  if(Object.values(FIREBASE_CONFIG).some(v=>!v||String(v).startsWith('PASTE'))){S.dbState='config';render();return;}
  firebase.initializeApp(FIREBASE_CONFIG);
  const fs=firebase.firestore();
  fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  S.db={doc:path=>fs.doc(path)};
  firebase.auth().getRedirectResult().catch(e=>toast('Sign-in failed: '+(e?.code||'unknown error')));
  firebase.auth().onAuthStateChanged(u=>{
    S.unsub.forEach(f=>f());S.unsub=[];
    S.parts={};S.contacts={};S.pending=new Set();
    if(!u){S.email='';S.dbState='signin';render();return;}
    S.email=u.email||'';S.dbState='loading';render();
    S.unsub.push(fs.collection('contacts').onSnapshot(snap=>{
      const next={};snap.docs.forEach(d=>{const v=d.data();if(v)next[d.id]=v;});S.contacts=next;
      if(S.view==='list'||S.view==='detail')render();
    },()=>{}));
    S.unsub.push(fs.collection('participants').onSnapshot({includeMetadataChanges:true},snap=>{
      const next={},pend=new Set();
      snap.docs.forEach(d=>{const v=d.data();if(v&&typeof v.code==='string'){next[d.id]=v;if(d.metadata.hasPendingWrites)pend.add(d.id);}});
      S.parts=next;S.pending=pend;S.dbState='ok';
      if(S.view==='list'||S.view==='detail')render();
    },err=>{S.dbState=err?.code==='permission-denied'?'denied':'offline';render();}));
  });
})();
setInterval(()=>{if(S.view==='list')render();},5*60*1000);
</script>
